    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              sap: {
                blue: '#0033A0',
                gold: '#F59E0B',
                light: '#38BDF8',
                dark: '#0A0F1D',
                card: '#131C31',
                border: '#1E293B'

            }
          }
        }

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
      /* Custom Animations & Horizon Glassmorphism */
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      .animate-float { animation: float 6s ease-in-out infinite; }

      @keyframes pulse-slow {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 0.7; }
      }
      .animate-pulse-slow { animation: pulse-slow 4s ease-in-out infinite; }

      @keyframes marquee {
        0% { transform: translateX(0%); }
        100% { transform: translateX(-50%); }
      }
      .animate-marquee { display: flex; width: 200%; animation: marquee 25s linear infinite; }
      .animate-marquee:hover { animation-play-state: paused; }

      .glass-card {
        background: rgba(19, 28, 49, 0.75);
        backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
      .glass-card:hover {
        border-color: rgba(56, 189, 248, 0.3);
        box-shadow: 0 10px 30px -10px rgba(0, 51, 160, 0.3);
      }
      .glow-blue {
        box-shadow: 0 0 40px rgba(0, 51, 160, 0.35);
      }
      .glow-cyan {
        box-shadow: 0 0 35px rgba(56, 189, 248, 0.25);
      }
    </style>
  </head>
  <body class="bg-[#0A0F1D] text-slate-100 font-sans selection:bg-sap-blue selection:text-white antialiased overflow-x-hidden">
